<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cute Chat</title>

  <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: pink;
      font-family: 'Cherry Bomb One', cursive;
      text-align: center;
      padding-top: 100px;
    }

    h1 {
      font-size: 60px;
      color: white;
      margin-bottom: 40px;
    }

    button {
      background-color: #ffc0cb;
      border: none;
      padding: 15px 35px;
      font-size: 20px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
      font-family: 'Cherry Bomb One', cursive;
    }

    button:hover {
      background-color: #ffb6c1;
      transform: scale(1.05);
    }

    #response, #finalMessage {
      font-size: 26px;
      margin-top: 30px;
      color: white;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      margin-top: 20px;
      width: 280px;
      outline: none;
      font-family: 'Cherry Bomb One', cursive;
    }

    .hidden {
      display: none;
    }

    #replySection {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Hello</h1>
  
  <button id="hiButton">Hi</button>

  <div id="response" class="hidden">hehe gawa mo</div>

  <div id="replySection" class="hidden">
    <input type="text" id="userReply" placeholder="Type your reply here...">
    <br>
    <button id="sendButton">Send</button>
  </div>

  <div id="finalMessage" class="hidden"></div>

  <script>
    const hiButton = document.getElementById('hiButton');
    const response = document.getElementById('response');
    const replySection = document.getElementById('replySection');
    const sendButton = document.getElementById('sendButton');
    const finalMessage = document.getElementById('finalMessage');
    const userReply = document.getElementById('userReply');

    const chillWords = [
      "wala naman", "wala", "nakahiga", "nakaupo", "nakatayo",
      "kumakain", "nanonood", "umiinom", "maliligo"
    ];

    hiButton.addEventListener('click', () => {
      response.classList.remove('hidden');
      replySection.classList.remove('hidden');
      hiButton.classList.add('hidden');
    });

    sendButton.addEventListener('click', () => {
      const reply = userReply.value.trim().toLowerCase();

      let message = "ahh sige"; // default

      if (reply.includes("miss kana")) {
        message = "heh";
      } else {
        for (let word of chillWords) {
          if (reply.includes(word)) {
            message = "ay oki hehe";
            break;
          }
        }
      }

      finalMessage.textContent = message;
      finalMessage.classList.remove('hidden');

      // Disable after one reply
      userReply.disabled = true;
      sendButton.disabled = true;
      sendButton.style.opacity = 0.5;
      sendButton.style.cursor = "not-allowed";
    });
  </script>

</body>
</html>
